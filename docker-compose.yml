# Optional. Barinder develops against a native Arch Postgres (pacman -S postgresql pgvector),
# which is lighter. This exists so anyone cloning the repo on any OS gets a working
# database with one command.
services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: groundwork_owner
      POSTGRES_PASSWORD: dev_owner_pw
      POSTGRES_DB: groundwork_dev
    ports:
      - '5432:5432'
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U groundwork_owner -d groundwork_dev']
      interval: 5s
      retries: 10
